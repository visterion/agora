name: docker
on:
  push:
    branches: [main]
  pull_request:
  # Manual trigger. Added 2026-08-06 after GitHub stopped creating run records for pushes to
  # main: two consecutive pushes produced no run at all while both workflows reported `active`,
  # and without this trigger there was no way to build an image. Dracul's equivalent workflow
  # has carried it from the start.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Test
        run: ./mvnw -B test
      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/visterion/agora:main
